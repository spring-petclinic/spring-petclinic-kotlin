# Detekt configuration overriding the default rule set
# (see https://detekt.dev/docs/introduction/configurations).
# Formatting rules are delegated to ktlint (org.jlleitschuh.gradle.ktlint plugin).

performance:
  SpreadOperator:
    active: false

style:
  FunctionOnlyReturningConstant:
    ignoreAnnotated:
      - 'GetMapping'
      - 'PostMapping'
      - 'RequestMapping'
  SerialVersionUIDInSerializableClass:
    active: false
  UnusedPrivateProperty:
    ignoreAnnotated:
      - 'MockkBean'
